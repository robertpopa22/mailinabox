# Fail2Ban filter Dovecot authentication and pop3/imap/managesieve server
# For Mail-in-a-Box

[INCLUDES]

before = common.conf

[Definition]

_daemon = (auth|dovecot(-auth)?|auth-worker)

failregex = ^%(__prefix_line)s(pop3|imap|managesieve)-login: (Info: )?(Aborted login|Disconnected)(: (Inactivity|Connection closed|Aborted login by logging out))? \(((no auth attempts|auth failed, \d+ attempts)( in \d+ secs)?|tried to use (disabled|disallowed) \S+ auth)\):( user=<\S*>,)?( method=\S+,)? rip=<HOST>, lip=(\d{1,3}\.){3}\d{1,3}(, TLS( handshaking)?(: Disconnected)?)?(, session=<\S+>)?\s*$

ignoreregex =

# DEV Notes:
# * the first regex is essentially a copy of pam-generic.conf
# * Probably doesn't do dovecot sql/ldap backends properly
#
# Author: Martin Waschbuesch
#         Daniel Black (rewrote with begin and end anchors)
#         Mail-in-a-Box (swapped session=...)
#         Geseidl Edition 2026-09-13: Dovecot 2.3.21 logs `Disconnected: Connection closed (auth failed` and
#         `Disconnected: Aborted login by logging out (auth failed` - upstream regex matched only `: Inactivity`,
#         leaving the jail blind (118/316k lines matched on GES-MAIL02).
