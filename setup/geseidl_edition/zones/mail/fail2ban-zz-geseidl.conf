# Geseidl Edition (2026-09-13) — praguri fail2ban pentru serviciile de mail.
# Instalat de setup/geseidl_edition/zones/mail/apply.sh in /etc/fail2ban/jail.d/zz-geseidl.conf.
# Fisier SEPARAT de mailinabox.conf (regenerat de `sudo mailinabox`); fail2ban citeste jail.d/*.conf
# alfabetic, deci valorile de aici prevaleaza.
#
# De ce: pragurile MiaB (dovecot maxretry=20/findtime=30s, postfix-sasl 5/10min) nu se ating niciodata
# la password spraying low-and-slow (1-2 incercari/IP/zi, 8 incercari la ~15 s apoi pauza de ore):
# 0 ban-uri in 18 h cu 1.532 esecuri SASL pe serverul de productie. Ferestre lungi + ban de o zi.
# ignoreip NU se seteaza aici: fail2ban citeste jail.d/*.conf apoi *.local, iar singurul proprietar
# al listei este /etc/fail2ban/jail.d/00-admin-ignoreip.local, gestionat local pe server (nu tot LAN-ul
# intern: un host intern compromis trebuie sa ramana banabil). Punctele NAT partajate (hairpin-ul
# routerului, SNAT-ul gateway-ului VPN) sunt adaugate acolo — o parola gresita pe un telefon nu trebuie
# sa blocheze tot overlay-ul pentru o zi.

[dovecot]
# Count authentication failures, but ignore pre-auth disconnects.
filter = dovecot[mode=normal]
maxretry = 5
findtime = 1h
bantime  = 1d

[postfix-sasl]
maxretry = 3
findtime = 1d
bantime  = 1d

[miab-postfix587]
maxretry = 3
findtime = 1d
bantime  = 1d

[miab-postfix465]
maxretry = 3
findtime = 1d
bantime  = 1d
